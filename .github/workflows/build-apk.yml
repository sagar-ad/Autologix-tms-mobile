name: Build AutoLogix TMS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android Project Root
        id: locate-project
        run: |
          echo "Scanning repository directory structure..."
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            echo "Gradle build discovered in root directory (.)"
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f "./mobile-app_v1/settings.gradle.kts" ] || [ -f "./mobile-app_v1/settings.gradle" ]; then
            echo "Gradle build discovered in ./mobile-app_v1"
            echo "PROJECT_DIR=./mobile-app_v1" >> $GITHUB_ENV
          else
            FOUND=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              echo "Gradle build discovered in $DIR"
              echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
            else
              echo "Could not find settings.gradle or settings.gradle.kts! Directory tree:"
              ls -la
              ls -la mobile-app_v1 || true
              exit 1
            fi
          fi

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > "${{ env.PROJECT_DIR }}/local.properties"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper Exists and Is Executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing or empty, regenerating wrapper with Gradle 8.7..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          if [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "Running with system Gradle 8.7 directly..."
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate Generated APK
        run: |
          find . -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autologix-tms-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-apk
          name: "AutoLogix TMS Android APK v1.0.0"
          body: "AutoLogix TMS Mobile Companion compiled Android Debug APK"
          files: "**/*.apk"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
