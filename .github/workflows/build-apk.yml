name: Build AutoLogix TMS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android Project & Configure SDK
        run: |
          if [ -f "./mobile-app_v1/settings.gradle.kts" ] || [ -f "./mobile-app_v1/settings.gradle" ]; then
            TARGET_DIR="./mobile-app_v1"
          elif [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            TARGET_DIR="."
          else
            TARGET_DIR="."
          fi
          echo "Discovered Android Project Root at: $TARGET_DIR"
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" > "$TARGET_DIR/local.properties"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew || true
          echo "=== Starting Gradle build ==="
          ./gradlew assembleDebug --stacktrace --no-daemon > build_output.log 2>&1 || {
            BUILD_STATUS=$?
            echo "=== Gradle build failed with exit code $BUILD_STATUS ==="
            cat build_output.log
            exit $BUILD_STATUS
          }
          echo "=== Gradle build succeeded ==="

      - name: Locate Generated APK
        run: |
          find . -name "*.apk" -ls

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-apk
          path: |
            **/*.apk
            **/build_output.log
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Create or Update GitHub Release (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-apk
          name: "AutoLogix TMS Android APK v1.0.0"
          body: "AutoLogix TMS Mobile Companion compiled Android Debug APK"
          files: "**/*.apk"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
