name: Build AutoLogix TMS Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android Project & Configure SDK
        run: |
          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            TARGET_DIR="."
          elif [ -f "./mobile-app_v1/mobile-app_v1/settings.gradle.kts" ]; then
            TARGET_DIR="./mobile-app_v1/mobile-app_v1"
          elif [ -f "./mobile-app_v1/settings.gradle.kts" ]; then
            TARGET_DIR="./mobile-app_v1"
          elif [ -d "./mobile-app_v1" ]; then
            TARGET_DIR="./mobile-app_v1"
          else
            TARGET_DIR="."
          fi
          echo "Discovered Android Project Root at: $TARGET_DIR"
          echo "PROJECT_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" > "$TARGET_DIR/local.properties"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Regenerating wrapper with Gradle 8.7..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        run: |
          find . -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autologix-tms-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-apk
          name: "AutoLogix TMS Android APK v1.0.0"
          body: "AutoLogix TMS Mobile Companion compiled Android Debug APK"
          files: "**/*.apk"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
